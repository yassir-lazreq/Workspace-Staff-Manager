<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>

    <div id="addContainer" class="hidden add-container">

        <div class="modal-overlay"></div>

        <div class="modal-content">
            <h2 class="modal-title">Ajouter un nouvel employé</h2>
            <form class="form" id="formulaire">

                <div>
                    <label for="nom" class="label">nom complet</label><br>
                    <input type="text" id="nom" placeholder="nom complet" class="input-field">
                </div>

                <div>
                    <label for="role" class="label">Role</label><br>
                    <select id="role" class="input-select">
                        <option value="manager">Manager</option>
                        <option value="receptionniste">Réceptionniste</option>
                        <option value="technicien it">Technicien IT</option>
                        <option value="agent securite">Agent Sécurité</option>
                        <option value="nettoyage">Nettoyage</option>
                    </select>
                </div>

                <div>
                    <label for="email" class="label">email</label><br>
                    <input type="email" id="email" placeholder="email" class="input-field">
                </div>

                <div>
                    <label for="telephone" class="label">téléphone</label><br>
                    <input type="tel" id="telephone" placeholder="téléphone" class="input-field">
                </div>

                <div>
                    <label for="img" class="label">photo</label><br>
                    <input type="file" id="img" class="input-file">
                </div>
                <div>
                    <label for="preview" class="label">preview</label><br>
                    <output>
                        <img id="preview" class="image-preview">
                    </output>
                </div>

                <div class="list-des-experience">
                    <div class="experience-header">
                        <label for="Expériences professionnelles" class="label">Expériences professionnelles</label>
                        <button type="button" class="add-experiance-btn" id="addExperianceBtn">+ Ajouter une
                            experience</button>
                    </div>
                    <div class="experiences-div">
                        <input type="text" placeholder="Entreprise" class="input-experience entreprise">
                        <input type="text" placeholder="Poste" class="input-experience poste">
                        <input type="text" placeholder="Période (2020 - 2025)" class="input-experience duree">
                    </div>

                </div>
                <button type="submit" class="Ajouter-employer" id="AjouterEmployer">Ajouter</button>
            </form>
        </div>
    </div>

    <div class="hidden add-container" id="employeeList">
        <div class="modal-overlay"></div>
        <div class="modal-content employee-list-modal">
            <h2 class="modal-title">choisir un employé</h2>
            <div id="departmentEmployeeList" class="department-employee-list">
                
            </div>
        </div>
    </div>

    <header class="header-main">
        <h1 class="header-title">Workspace</h1>
    </header>

    <main class="main-layout">

        <section class="sidebar">

            <div class="sidebar-header">
                <img src="assets/users.png" alt="employee icon" class="icon-employee">
                <h2 class="section-title">Employés non assignés</h2>
            </div>

            <button id="ajouter" class="primary-button">
                ajouter un employé +
            </button>

            <div id="unassined" class="unassigned-list">
                <!-- Liste des employés non assignés -->
            </div>

        </section>

        <div id="departments" class="departments-container">

            <div id="salleConference" class="department-card salleConference">
                <div class="department-header">
                    <h4 class="department-title">Salle des conférences</h4>
                    <p class="department-count">0/10</p>
                    <img src="assets/plus-solid-full.svg" data-departement="salleConference" data-accessibilite="manager,receptionniste,technicien it,nettoyage,personnel,securite" data-max="10" alt="plus icon" class="icon-plus">
                </div>
                <div class="department-employee-list">
                    <!-- Liste des employés assignés à la salle des conférences -->
                </div>
            </div>

            <div id="reception" class="department-card reception">
                <div class="department-header">
                    <h4 class="department-title">Réception</h4>
                    <p class="department-count">0/5</p>
                    <img src="assets/plus-solid-full.svg" data-departement="reception" data-accessibilite="receptionniste,manager,nettoyage" data-max="5" alt="plus icon" class="icon-plus">
                </div>
                <div class="department-employee-list">
                    <!-- Liste des employés assignés à la réception -->
                </div>
            </div>

            <div id="salleServeur" class="department-card salleServeur">
                <div class="department-header">
                    <h4 class="department-title">Salle des serveurs</h4>
                    <p class="department-count">0/4</p>
                    <img src="assets/plus-solid-full.svg" data-departement="salleServeur" data-accessibilite="technicien it,manager,nettoyage" data-max="4" alt="plus icon" class="icon-plus">
                </div>
                <div class="department-employee-list">
                    <!-- Liste des employés assignés à la salle des serveurs -->
                </div>
            </div>

            <div id="salleSecurite" class="department-card salleSecurite">
                <div class="department-header">
                    <h4 class="department-title">Salle des Securite</h4>
                    <p class="department-count">0/3</p>
                    <img src="assets/plus-solid-full.svg" data-departement="salleSecurite" data-accessibilite="agent securite,manager,nettoyage" data-max="3" alt="plus icon" class="icon-plus">
                </div>
                <div class="department-employee-list">
                    <!-- Liste des employés assignés à la salle des securite -->
                </div>
            </div>

            <div id="sallePersonnel" class="department-card sallePersonnel">
                <div class="department-header">
                    <h4 class="department-title">Salle des personnel</h4>
                    <p class="department-count">0/6</p>
                    <img src="assets/plus-solid-full.svg" data-departement="sallePersonnel" data-accessibilite="manager,receptionniste,technicien it,nettoyage,personnel,securite" data-max="6" alt="plus icon" class="icon-plus">
                </div>
                <div class="department-employee-list">
                    <!-- Liste des employés assignés à la salle des personnel -->
                </div>
            </div>

            <div id="salleArchives" class="department-card salleArchives">
                <div class="department-header">
                    <h4 class="department-title">Salle des archives</h4>
                    <p class="department-count">0/2</p>
                    <img src="assets/plus-solid-full.svg" data-departement="salleArchives" data-accessibilite="archives,manager" data-max="2" alt="plus icon" class="icon-plus">
                </div>
                <div class="department-employee-list">
                    <!-- Liste des employés assignés à la salle des archives -->
                </div>
            </div>
        </div>

    </main>

    <script src="main.js"></script>
</body>

</html>
