<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace - Employee Management</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>

    <!-- Add Employee Modal -->
    <div id="addContainer" class="hidden add-container">
        <div class="modal-overlay"></div>

        <div class="modal-content">
            <h2 class="modal-title">Ajouter un nouvel employé</h2>

            <form class="form" id="formulaire">
                <div>
                    <label for="nom" class="label">Nom complet</label><br>
                    <input type="text" id="nom" placeholder="Nom complet" class="input-field">
                    <span class="error-message" id="nom-error"></span>
                </div>

                <div>
                    <label for="role" class="label">Rôle</label><br>
                    <select id="role" class="input-select">
                        <option value="">Sélectionner un rôle</option>
                        <option value="manager">Manager</option>
                        <option value="receptionniste">Réceptionniste</option>
                        <option value="technicien it">Technicien IT</option>
                        <option value="agent securite">Agent Sécurité</option>
                        <option value="nettoyage">Nettoyage</option>
                    </select>
                    <span class="error-message" id="role-error"></span>
                </div>

                <div>
                    <label for="email" class="label">Email</label><br>
                    <input type="email" id="email" placeholder="Email" class="input-field">
                    <span class="error-message" id="email-error"></span>
                </div>

                <div>
                    <label for="telephone" class="label">Téléphone</label><br>
                    <input type="tel" id="telephone" placeholder="Téléphone" class="input-field">
                    <span class="error-message" id="telephone-error"></span>
                </div>

                <div>
                    <label for="img" class="label">Photo</label><br>
                    <input type="file" id="img" accept="image/*" class="input-file">
                    <span class="error-message" id="img-error"></span>
                </div>

                <div>
                    <label for="preview" class="label">Aperçu</label><br>
                    <output>
                        <img id="preview" class="image-preview" alt="">
                    </output>
                </div>

                <div class="list-des-experience">
                    <div class="experience-header">
                        <label class="label">Expériences professionnelles</label>
                        <button type="button" class="add-experience-btn" id="addExperienceBtn">
                            + Ajouter une expérience
                        </button>
                    </div>

                    <div class="experiences-div">
                        <input type="text" placeholder="Entreprise" class="input-experience entreprise">
                        <input type="text" placeholder="Poste" class="input-experience poste">
                        <input type="date" class="input-experience start-date" placeholder="Date de début">

                        <input type="date" class="input-experience end-date" placeholder="Date de fin">
                    </div>
                </div>

                <button type="submit" class="Ajouter-employer" id="AjouterEmployer">Ajouter</button>
            </form>
        </div>
    </div>

    <!-- Employee Selection Modal -->
    <div class="hidden add-container" id="employeeList">
        <div class="modal-overlay"></div>

        <div class="modal-content employee-list-modal">
            <h2 class="modal-title">Choisir un employé</h2>
            <div id="departmentEmployeeList" class="department-employee-list">
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="header-main">
        <h1 class="header-title">Workspace</h1>
    </header>

    <!-- Main Content -->
    <main class="main-layout">
        <!-- Sidebar - Unassigned Employees -->
        <section class="sidebar">
            <div class="sidebar-header">
                <img src="assets/users.png" alt="Employee icon" class="icon-employee">
                <h2 class="section-title">Employés non assignés</h2>
            </div>

            <button id="ajouter" class="primary-button">
                Ajouter un employé +
            </button>

            <div id="unassigned" class="unassigned-list">
            </div>
        </section>

        <!-- Departments Layout -->
        <div id="departments" class="departments-container">
            <!-- Conference Room -->
            <div id="salleConference" class="department-card salleConference">
                <div class="department-header">
                    <h4 class="department-title">Salle des conférences</h4>
                    <p class="department-count">0/10</p>
                    <img src="assets/plus-solid-full.svg" data-departement="salleConference"
                        data-accessibilite="manager,receptionniste,technicien it,nettoyage,personnel,securite"
                        data-max="10" alt="Add employee" class="icon-plus">
                </div>
                <div class="employee-list-in-department">
                </div>
            </div>

            <!-- Reception -->
            <div id="reception" class="department-card reception">
                <div class="department-header">
                    <h4 class="department-title">Réception</h4>
                    <p class="department-count">0/5</p>
                    <img src="assets/plus-solid-full.svg" data-departement="reception"
                        data-accessibilite="receptionniste,manager,nettoyage" data-max="5" alt="Add employee"
                        class="icon-plus">
                </div>
                <div class="employee-list-in-department">
                </div>
            </div>

            <!-- Server Room -->
            <div id="salleServeur" class="department-card salleServeur">
                <div class="department-header">
                    <h4 class="department-title">Salle des serveurs</h4>
                    <p class="department-count">0/4</p>
                    <img src="assets/plus-solid-full.svg" data-departement="salleServeur"
                        data-accessibilite="technicien it,manager,nettoyage" data-max="4" alt="Add employee"
                        class="icon-plus">
                </div>
                <div class="employee-list-in-department">
                </div>
            </div>

            <!-- Security Room -->
            <div id="salleSecurite" class="department-card salleSecurite">
                <div class="department-header">
                    <h4 class="department-title">Salle de sécurité</h4>
                    <p class="department-count">0/3</p>
                    <img src="assets/plus-solid-full.svg" data-departement="salleSecurite"
                        data-accessibilite="agent securite,manager,nettoyage" data-max="3" alt="Add employee"
                        class="icon-plus">
                </div>
                <div class="employee-list-in-department">
                </div>
            </div>

            <!-- Staff Room -->
            <div id="sallePersonnel" class="department-card sallePersonnel">
                <div class="department-header">
                    <h4 class="department-title">Salle du personnel</h4>
                    <p class="department-count">0/6</p>
                    <img src="assets/plus-solid-full.svg" data-departement="sallePersonnel"
                        data-accessibilite="manager,receptionniste,technicien it,nettoyage,personnel,securite"
                        data-max="6" alt="Add employee" class="icon-plus">
                </div>
                <div class="employee-list-in-department">
                </div>
            </div>

            <!-- Archives Room -->
            <div id="salleArchives" class="department-card salleArchives">
                <div class="department-header">
                    <h4 class="department-title">Salle des archives</h4>
                    <p class="department-count">0/2</p>
                    <img src="assets/plus-solid-full.svg" data-departement="salleArchives" data-accessibilite="manager"
                        data-max="2" alt="Add employee" class="icon-plus">
                </div>
                <div class="employee-list-in-department">
                </div>
            </div>
        </div>
    </main>

    <script src="main.js"></script>
</body>

</html>
